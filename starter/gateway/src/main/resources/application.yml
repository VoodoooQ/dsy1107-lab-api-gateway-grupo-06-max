server:
  port: 8080

spring:
  application:
    name: dsy1107-api-gateway-lab
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: posts-v1
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v1/posts/**
                

              filters:
                - RewritePath=/api/v1/(?<segment>.*), /$\{segment}
                - AddResponseHeader=X-API-Version, v1

            - id: posts-v2
              uri: https://jsonplaceholder.typicode.com
              predicates:
              - Path=/api/v2/posts/**


              filters:
                - RewritePath=/api/v2/(?<segment>.*), /$\{segment}
                - AddResponseHeader=X-API-Version, v2

lab:
  cors:
    enabled: false
    allowed-origin: http://localhost:5500
